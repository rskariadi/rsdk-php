name: Build, Test, and Push Docker Images

on:
  push:
    branches:
      - kardev

env:
  IMAGE_NAME: rskariadi/rsdk-php

jobs:
  preflight-legacy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build preflight legacy image (dev, PHP 7.4)
        uses: docker/build-push-action@v5
        with:
          context: .
          push: false
          load: true
          target: dev
          tags: local/rsdk-php:preflight-dev-php7.4-legacy
          build-args: |
            PHP_BASE_IMAGE_VERSION=7.4-fpm
            MSSQL_PROFILE=legacy

      - name: Verify preflight extension baseline
        run: |
          set -e
          IMAGE="local/rsdk-php:preflight-dev-php7.4-legacy"
          REQUIRED_EXTS="pdo_mysql mysqli mbstring exif pcntl bcmath intl zip soap ftp opcache gd pdo_pgsql mongodb redis sqlsrv pdo_sqlsrv imagick"
          check_extension() {
            ext="$1"
            case "$ext" in
              opcache)
                docker run --rm "$IMAGE" php -m | grep -Ei '^(Zend OPcache|opcache)$' >/dev/null
                ;;
              *)
                docker run --rm "$IMAGE" php -m | grep -i "^$ext$" >/dev/null
                ;;
            esac
          }
          for ext in $REQUIRED_EXTS; do
            check_extension "$ext" || {
              echo "Missing extension: $ext"
              exit 1
            }
          done

      - name: Verify preflight OpenSSL legacy config
        run: |
          docker run --rm local/rsdk-php:preflight-dev-php7.4-legacy sh -lc "grep -Eiq '^[[:space:]]*CipherString[[:space:]]*=[[:space:]]*DEFAULT:?@SECLEVEL=0[[:space:]]*$' /etc/ssl/openssl.cnf && grep -Eiq '^[[:space:]]*MinProtocol[[:space:]]*=[[:space:]]*TLSv1(\.0)?[[:space:]]*$' /etc/ssl/openssl.cnf"

  test-matrix:
    needs: preflight-legacy
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php_version: ["7.4", "8.0", "8.1", "8.2", "8.3", "8.4", "8.5"]
        target: ["dev", "nginx", "apache"]
        mssql_profile: ["legacy"]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Compute build args
        id: vars
        run: |
          if [ "${{ matrix.target }}" = "apache" ]; then
            echo "base_image=${{ matrix.php_version }}-apache" >> "$GITHUB_OUTPUT"
          else
            echo "base_image=${{ matrix.php_version }}-fpm" >> "$GITHUB_OUTPUT"
          fi

      - name: Build image for testing
        uses: docker/build-push-action@v5
        with:
          context: .
          push: false
          load: true
          target: ${{ matrix.target }}
          tags: local/rsdk-php:test-${{ matrix.target }}-php${{ matrix.php_version }}-${{ matrix.mssql_profile }}
          build-args: |
            PHP_BASE_IMAGE_VERSION=${{ steps.vars.outputs.base_image }}
            MSSQL_PROFILE=${{ matrix.mssql_profile }}

      - name: Smoke test required extensions
        run: |
          set -e
          IMAGE="local/rsdk-php:test-${{ matrix.target }}-php${{ matrix.php_version }}-${{ matrix.mssql_profile }}"
          REQUIRED_EXTS="pdo_mysql mysqli mbstring exif pcntl bcmath intl zip soap ftp opcache gd pdo_pgsql mongodb redis imagick"
          if [ "${{ matrix.php_version }}" != "8.5" ]; then
            REQUIRED_EXTS="$REQUIRED_EXTS sqlsrv pdo_sqlsrv"
          fi
          check_extension() {
            ext="$1"
            case "$ext" in
              opcache)
                docker run --rm "$IMAGE" php -m | grep -Ei '^(Zend OPcache|opcache)$' >/dev/null
                ;;
              *)
                docker run --rm "$IMAGE" php -m | grep -i "^$ext$" >/dev/null
                ;;
            esac
          }
          for ext in $REQUIRED_EXTS; do
            check_extension "$ext" || {
              echo "Missing extension: $ext"
              exit 1
            }
          done

      - name: Verify OpenSSL legacy config
        run: |
          set -e
          IMAGE="local/rsdk-php:test-${{ matrix.target }}-php${{ matrix.php_version }}-${{ matrix.mssql_profile }}"
          docker run --rm "$IMAGE" sh -lc "grep -Eiq '^[[:space:]]*CipherString[[:space:]]*=[[:space:]]*DEFAULT:?@SECLEVEL=0[[:space:]]*$' /etc/ssl/openssl.cnf && grep -Eiq '^[[:space:]]*MinProtocol[[:space:]]*=[[:space:]]*TLSv1(\.0)?[[:space:]]*$' /etc/ssl/openssl.cnf"

  push-matrix:
    runs-on: ubuntu-latest
    needs: test-matrix
    if: github.ref == 'refs/heads/kardev'
    strategy:
      fail-fast: false
      matrix:
        php_version: ["7.4", "8.0", "8.1", "8.2", "8.3", "8.4", "8.5"]
        target: ["dev", "nginx", "apache"]
        mssql_profile: ["legacy"]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Compute build args
        id: vars
        run: |
          if [ "${{ matrix.target }}" = "apache" ]; then
            echo "base_image=${{ matrix.php_version }}-apache" >> "$GITHUB_OUTPUT"
          else
            echo "base_image=${{ matrix.php_version }}-fpm" >> "$GITHUB_OUTPUT"
          fi
          if [ "${{ matrix.mssql_profile }}" = "legacy" ]; then
            echo "tag_suffix=${{ matrix.target }}-php${{ matrix.php_version }}" >> "$GITHUB_OUTPUT"
          else
            echo "tag_suffix=${{ matrix.target }}-php${{ matrix.php_version }}-${{ matrix.mssql_profile }}" >> "$GITHUB_OUTPUT"
          fi

      - name: Build and Push Matrix Image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          target: ${{ matrix.target }}
          tags: ${{ env.IMAGE_NAME }}:${{ steps.vars.outputs.tag_suffix }}
          build-args: |
            PHP_BASE_IMAGE_VERSION=${{ steps.vars.outputs.base_image }}
            MSSQL_PROFILE=${{ matrix.mssql_profile }}
