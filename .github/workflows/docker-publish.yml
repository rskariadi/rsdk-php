name: Build & Push Docker Images

on:
  push:
    branches:
      - kardev

jobs:
  docker:
    runs-on: ubuntu-latest

    steps:
      # Checkout repo
      - name: Checkout repository
        uses: actions/checkout@v4

      # Login ke Docker Hub
      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # Build & Push Dev Image
      - name: Build and Push Dev
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          target: dev
          tags: rskariadi/rsdk-php:dev
          build-args: |
            PHP_BASE_IMAGE_VERSION=8.2-fpm

      # Build & Push Nginx Image
      - name: Build and Push Nginx
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          target: nginx
          tags: rskariadi/rsdk-php:nginx
          build-args: |
            PHP_BASE_IMAGE_VERSION=8.2-fpm

      # Build & Push Apache Image
      - name: Build and Push Apache
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          target: apache
          tags: rskariadi/rsdk-php:apache
          build-args: |
            PHP_BASE_IMAGE_VERSION=8.2-apache
