name: Build, Test, and Push Docker Images

on:
  push:
    branches:
      - kardev

env:
  IMAGE_NAME: rskariadi/rsdk-php

jobs:
  test-matrix:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php_version: ["7.4", "8.0", "8.1", "8.2", "8.3", "8.4", "8.5"]
        target: ["dev", "nginx", "apache"]
        mssql_profile: ["modern", "legacy"]
        exclude:
          - target: nginx
            mssql_profile: legacy
          - target: apache
            mssql_profile: legacy

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Compute build args
        id: vars
        run: |
          if [ "${{ matrix.target }}" = "apache" ]; then
            echo "base_image=${{ matrix.php_version }}-apache" >> "$GITHUB_OUTPUT"
          else
            echo "base_image=${{ matrix.php_version }}-fpm" >> "$GITHUB_OUTPUT"
          fi

      - name: Build image for testing
        uses: docker/build-push-action@v5
        with:
          context: .
          push: false
          load: true
          target: ${{ matrix.target }}
          tags: local/rsdk-php:test-${{ matrix.target }}-php${{ matrix.php_version }}-${{ matrix.mssql_profile }}
          build-args: |
            PHP_BASE_IMAGE_VERSION=${{ steps.vars.outputs.base_image }}
            MSSQL_PROFILE=${{ matrix.mssql_profile }}

      - name: Smoke test required extensions
        run: |
          set -e
          IMAGE="local/rsdk-php:test-${{ matrix.target }}-php${{ matrix.php_version }}-${{ matrix.mssql_profile }}"
          REQUIRED_EXTS="pdo_mysql mysqli mbstring exif pcntl bcmath intl zip soap ftp opcache gd pdo_pgsql mongodb redis sqlsrv pdo_sqlsrv imagick"
          for ext in $REQUIRED_EXTS; do
            docker run --rm "$IMAGE" php -m | grep -i "^$ext$" >/dev/null || {
              echo "Missing extension: $ext"
              exit 1
            }
          done

      - name: Verify OpenSSL downgrade only in legacy profile
        run: |
          set -e
          IMAGE="local/rsdk-php:test-${{ matrix.target }}-php${{ matrix.php_version }}-${{ matrix.mssql_profile }}"
          if [ "${{ matrix.mssql_profile }}" = "legacy" ]; then
            docker run --rm "$IMAGE" sh -lc "grep -q 'DEFAULT@SECLEVEL=0' /etc/ssl/openssl.cnf && grep -q 'MinProtocol = TLSv1.0' /etc/ssl/openssl.cnf"
          else
            docker run --rm "$IMAGE" sh -lc "! grep -q 'DEFAULT@SECLEVEL=0' /etc/ssl/openssl.cnf"
          fi

  push-matrix:
    runs-on: ubuntu-latest
    needs: test-matrix
    if: github.ref == 'refs/heads/kardev'
    strategy:
      fail-fast: false
      matrix:
        php_version: ["7.4", "8.0", "8.1", "8.2", "8.3", "8.4", "8.5"]
        target: ["dev", "nginx", "apache"]
        mssql_profile: ["modern", "legacy"]
        exclude:
          - target: nginx
            mssql_profile: legacy
          - target: apache
            mssql_profile: legacy

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Compute build args
        id: vars
        run: |
          if [ "${{ matrix.target }}" = "apache" ]; then
            echo "base_image=${{ matrix.php_version }}-apache" >> "$GITHUB_OUTPUT"
          else
            echo "base_image=${{ matrix.php_version }}-fpm" >> "$GITHUB_OUTPUT"
          fi
          echo "tag_suffix=${{ matrix.target }}-php${{ matrix.php_version }}-${{ matrix.mssql_profile }}" >> "$GITHUB_OUTPUT"

      - name: Build and Push Matrix Image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          target: ${{ matrix.target }}
          tags: ${{ env.IMAGE_NAME }}:${{ steps.vars.outputs.tag_suffix }}
          build-args: |
            PHP_BASE_IMAGE_VERSION=${{ steps.vars.outputs.base_image }}
            MSSQL_PROFILE=${{ matrix.mssql_profile }}
