services:
  php-dev:
    build:
      context: .
      target: dev
      args:
        PHP_BASE_IMAGE_VERSION: "8.2-fpm"
    volumes:
      - .:/app
    ports:
      - "9000:9000"
    environment:
      PHP_ENABLE_XDEBUG: 1

  php-nginx:
    build:
      context: .
      target: nginx
      args:
        PHP_BASE_IMAGE_VERSION: "8.2-fpm"
    ports:
      - "8080:80"
    volumes:
      - .:/app

  php-apache:
    build:
      context: .
      target: apache
      args:
        PHP_BASE_IMAGE_VERSION: "8.2-apache"
    ports:
      - "8081:80"
    volumes:
      - .:/app
