services:
  php-dev:
    build:
      context: .
      target: dev
      args:
        PHP_BASE_IMAGE_VERSION: "${PHP_DEV_BASE_IMAGE_VERSION:-8.2-fpm}"
        MSSQL_PROFILE: "${MSSQL_PROFILE:-legacy}"
    volumes:
      - .:/app
    ports:
      - "9000:9000"
    environment:
      PHP_ENABLE_XDEBUG: 1

  php-nginx:
    build:
      context: .
      target: nginx
      args:
        PHP_BASE_IMAGE_VERSION: "${PHP_NGINX_BASE_IMAGE_VERSION:-8.2-fpm}"
        MSSQL_PROFILE: "${MSSQL_PROFILE:-legacy}"
    ports:
      - "8080:80"
    volumes:
      - .:/app

  php-apache:
    build:
      context: .
      target: apache
      args:
        PHP_BASE_IMAGE_VERSION: "${PHP_APACHE_BASE_IMAGE_VERSION:-8.2-apache}"
        MSSQL_PROFILE: "${MSSQL_PROFILE:-legacy}"
    ports:
      - "8081:80"
    volumes:
      - .:/app

  php-dev-legacy:
    build:
      context: .
      target: dev
      args:
        PHP_BASE_IMAGE_VERSION: "${PHP_DEV_LEGACY_BASE_IMAGE_VERSION:-7.4-fpm}"
        MSSQL_PROFILE: "legacy"
    volumes:
      - .:/app
    ports:
      - "9001:9000"
    environment:
      PHP_ENABLE_XDEBUG: 1
